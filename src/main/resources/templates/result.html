<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー一覧</title>
</head>
<body>
    <div th:insert="header :: headerFragment"></div>

    <h1>ユーザー一覧</h1>

    <form th:action="@{/deleteconfirm}" method="post">
        <table border="1">
            <tr>
                <th>選択</th>
                <th>ID</th>
                <th>ユーザー名</th>
            </tr>
            <tr th:each="userc : ${usercs}">
                <td>
                    <input type="checkbox" name="selectedIds"
                           th:value="${userc.id}"
                          >
                </td>
                <td th:text="${userc.id}"></td>
                <td th:text="${userc.name}"></td>
            </tr>
        </table>

        <button type="submit">選択したユーザーを削除</button>
    </form>

    <p th:if="${msg}" th:text="${msg}" style="color:red;"></p>
</body>
</html>
