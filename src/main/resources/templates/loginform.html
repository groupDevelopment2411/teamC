
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ログイン</title>
</head>
<body>
	<h1>ログイン</h1>
	<form action="/sendlogin" method="post" onsubmit="return validateForm()">
		ID: <input type="text" name="id" id="id"/><br>
		パスワード: <input type="password" name="password" id="password"><br>
		<input type="submit" value="ログイン">
		<a href="third">戻る</a>
	</form>
<script>
		function validateForm() {
		    const id = document.getElementById("id").value.trim();
		    const password = document.getElementById("password").value.trim();

			
			if (id === "" || password === "") {
							        alert("IDとパスワードを入力してください。");
							        return false;
			
		    if (id === "") {
		        alert("IDを入力してください。");
		        return false;
		    }

		    if (password === "") {
		        alert("パスワードを入力してください。");
		        return false;
		    }
			
				    }
		    if (!/^\d+$/.test(id)) {
		        alert("IDは数字で入力してください。");
		        return false;
		    }

		    if (password.length < 6) {
		        alert("パスワードは6文字以上で入力してください。");
		        return false;
		    }
			function validateLoginForm() {
			           var id = document.getElementById('id').value;
			           var password = document.getElementById('password').value;

			           // IDとパスワードが未入力の場合
			           if (!id || !password) {
			               alert('IDまたはパスワードが入力されていません');
			               return false;  // 送信をキャンセル
			           }

			           // サーバーへ送信してIDとパスワードが一致するか確認（仮にIDとパスワードが「test」の場合）
			           if (id !== "test" || password !== "test") {
			               alert('IDまたはパスワードが間違っています');
			               return false;  // 送信をキャンセル
			           }
                     return true;}}
	</script>
</body>
</html>
