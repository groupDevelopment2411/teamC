<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>    
    <h1>ログイン!!</h1>

	<form action="/sendlogin" method="post">
	    <label for="id">ID:</label>
	    <input type="text" id="id" name="id" th:value="${id}" required>
	    
	    <label for="password">Password:</label>
	    <input type="password" id="password" name="password" th:value="${password}" required>
	    
	    <p th:if="${msg}" th:text="${msg}" style="color:red;"></p>

	    <button type="submit">ログイン</button>
	</form>

<script>
	
	</script>
</body>
</html>
