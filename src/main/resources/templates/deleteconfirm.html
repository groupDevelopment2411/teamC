<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>削除確認</title>
</head>
<body>

    <!-- ヘッダーフラグメントの挿入 -->
    <div th:insert="header :: headerFragment"></div>

    <h1>社員情報削除(確認)</h1>
    
    <p>本当に削除しますか？</p>

    <!-- 削除確認フォーム -->
    <form action="/delete" method="post" onsubmit="return checkBeforeSubmit()">
        <div th:each="id : ${selectedIds}">
            <input type="text" name="selectedIds" th:value="${id}" readonly>
        </div>
        <input type="submit" value="削除">
    </form>

    <!-- 戻るボタン（th:if で切り替え） -->
	<a th:if="${returnTo == 'kensaku'}" th:href="@{/kensaku}" class="btn btn-secondary">戻る</a>
	<a th:if="${returnTo == 'Allform'}" th:href="@{/Allform}" class="btn btn-secondary">戻る</a>
	<a th:if="${returnTo != 'kensaku' and returnTo != 'Allform'}" href="javascript:history.back()" class="btn btn-secondary">戻る</a>


    <!-- セッションIDをJavaScriptに渡す（formを閉じ忘れない） -->
    <form action="/deleteconfirm" method="post">
        <input type="hidden" name="returnTo" th:value="${returnTo}" />
    </form>

    <!-- JavaScript -->
    <script th:inline="javascript">
        var loginUserId = /*[[${session.id}]]*/ 0;
        function checkBeforeSubmit() {
            const selectedIds = document.getElementsByName("selectedIds");
            if (selectedIds.length === 0) {
                alert("削除する項目を選択してください");
                return false;
            }
            for (let i = 0; i < selectedIds.length; i++) {
                const id = parseInt(selectedIds[i].value, 10);
                if (id === loginUserId) {
                    alert("ログイン中のユーザーは削除できません。");
                    return false;
                }
            }
            return true;
        }
    </script>

</body>
</html>
