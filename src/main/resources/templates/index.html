<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
</head>
<body>
	<h1>ログイン</h1>

	<form action="/sendlogin" method="post" onsubmit="return validateForm()">
		ID: <input type="text" name="id" id="id" th:value="${id}"/><br>
		パスワード: <input type="password" name="password" id="password" th:value="${password}"><br>
		<input type="submit" value="ログイン">
	</form>

	<div th:insert="footer :: footerFragment"></div>

	<script th:inline="javascript">
	/*<![CDATA[*/
	    var msg = /*[[${msg}]]*/ ''; // msgの値が空なら空文字をデフォルト値として設定

	    if (msg) {
	        alert(msg); // msgが存在する場合、アラートで表示
	    }
	/*]]>*/
	</script>
	<script th:inline="javascript">
	/*<![CDATA[*/
	function validateForm() {
	    const id = document.getElementById("id").value.trim();
	    const password = document.getElementById("password").value.trim();
	    let message = "";

	    if (id === "" && password === "") {
	        message = "IDとパスワードを入力してください。";
	    } else if (id === "") {
	        message = "IDを入力してください。";
	    } else if (password === "") {
	        message = "パスワードを入力してください。";
	    } else if (!/^\d+$/.test(id)) {
	        message = "IDは半角数字で入力してください。";
	    } else if (password.length < 6) {
	        message = "パスワードは6文字以上で入力してください。";
	    }

	    if (message !== "") {
	        alert(message);
	        return false;
	    }

	    return true;
	}
	/*]]>*/
	</script>

</body>
</html>
